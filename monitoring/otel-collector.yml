receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  attributes/data_protection:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: url.query
        action: delete
      - key: db.redis.args
        action: delete
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: exception.message
        action: delete
      - key: exception.stacktrace
        action: delete
  filter/langsmith_main_agent:
    error_mode: ignore
    trace_conditions:
      - 'span.attributes["langsmith.export"] != true'
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  debug:
    verbosity: basic
  otlp_http/langsmith:
    endpoint: ${env:OTEL_COLLECTOR_LANGSMITH_ENDPOINT}
    headers:
      x-api-key: ${env:OTEL_COLLECTOR_LANGSMITH_API_KEY}
      Langsmith-Project: ${env:OTEL_COLLECTOR_LANGSMITH_PROJECT}
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces/debug:
      receivers: [otlp]
      processors: [memory_limiter, attributes/data_protection, batch]
      exporters: [debug]
    traces/langsmith:
      receivers: [otlp]
      processors: [memory_limiter, attributes/data_protection, filter/langsmith_main_agent, batch]
      exporters: [otlp_http/langsmith]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
