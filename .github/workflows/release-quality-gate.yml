name: Release Quality Gate

on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: "Confirm the fixed 100 cases may call the paid model API"
        required: true
        type: boolean
        default: false
      max_workflow_calls:
        description: "Hard budget for estimated Workflow LLM calls"
        required: true
        type: number
        default: 300

permissions:
  contents: read

concurrency:
  group: release-quality-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-llm-baseline:
    name: Real LLM 100-Case Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release-quality-gate
    env:
      APP_ENV: testing
      DATABASE_URL: sqlite+aiosqlite:///./release-quality-gate.db
      VECTOR_DB_PERSIST_DIR: ./.runtime/release-quality-gate-chroma
      LLM_PROVIDER: openai
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
      LLM_FAST_BASE_URL: ${{ secrets.LLM_FAST_BASE_URL }}
      LLM_FAST_API_KEY: ${{ secrets.LLM_FAST_API_KEY }}
      LLM_FAST_MODEL_NAME: ${{ secrets.LLM_FAST_MODEL_NAME }}
      LLM_ANALYZER_MODEL_NAME: ${{ secrets.LLM_ANALYZER_MODEL_NAME }}
      LLM_QA_MODEL_NAME: ${{ secrets.LLM_QA_MODEL_NAME }}
      OTEL_ENABLED: "false"
      QWEN3_GUARD_ENABLED: "false"
      GIT_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Require explicit paid-run confirmation
        run: test "${{ inputs.confirm_live }}" = "true"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements/base.txt
            requirements/test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt

      - name: Validate release secrets
        run: |
          test -n "$LLM_BASE_URL"
          test -n "$LLM_API_KEY"
          test -n "$LLM_MODEL_NAME"

      - name: Run full backend tests
        run: python -m pytest -q

      - name: Seed isolated knowledge base
        run: python scripts/seed_kb.py

      - name: Replay real LLM Baseline
        run: |
          python scripts/run_baseline_eval.py \
            --confirm-live \
            --max-workflow-calls "${{ inputs.max_workflow_calls }}" \
            --output-dir evaluation/reports/release_baseline

      - name: Enforce release quality policy
        run: |
          python scripts/check_quality_gate.py \
            --profile release \
            --report evaluation/reports/release_baseline/baseline_v1_latest.json \
            --output-dir evaluation/reports/release_quality_gate

      - name: Upload immutable Baseline and gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality-gate-${{ github.run_id }}
          path: |
            evaluation/reports/release_baseline/
            evaluation/reports/release_quality_gate/
          if-no-files-found: warn
          retention-days: 30
