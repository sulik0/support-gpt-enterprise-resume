name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements/base.txt
            requirements/test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt

      - name: Compile
        run: python -m compileall -q src scripts tests

      - name: Run full backend test suite
        env:
          APP_ENV: testing
          LLM_PROVIDER: mock
          OTEL_ENABLED: "false"
          QWEN3_GUARD_ENABLED: "false"
        run: python -m pytest -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  agent-quality-gate:
    name: Agent PR Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements/base.txt
            requirements/test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt

      - name: Replay fixed 100-case Baseline with Mock Provider
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          python scripts/run_ci_quality_gate.py \
            --output-dir evaluation/reports/ci_quality_gate

      - name: Upload quality-gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-pr-quality-gate-${{ github.run_id }}
          path: evaluation/reports/ci_quality_gate/
          if-no-files-found: error
          retention-days: 14

  container-build:
    name: Container Build
    needs: [backend-tests, frontend-build, agent-quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify production image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          push: false
          tags: supportgpt-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
