apiVersion: v1
kind: ConfigMap
metadata:
  name: supportgpt-config
  namespace: default
data:
  APP_ENV: "production"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres-svc:5432/supportgpt"
  REDIS_URL: "redis://redis-svc:6379/0"
  LLM_PROVIDER: "mock"
  VECTOR_DB_PERSIST_DIR: "/data/chromadb/0.5"
  TOOL_POLICY_VERSION: "tool-policy-v2.2"
  TOOL_OUTBOX_WORKER_ENABLED: "true"
  TOOL_OUTBOX_POLL_INTERVAL_SECONDS: "1"
  TOOL_OUTBOX_BATCH_SIZE: "20"
  TOOL_OUTBOX_LEASE_SECONDS: "30"
  TOOL_OUTBOX_MAX_ATTEMPTS: "5"
  TOOL_OUTBOX_RETRY_BASE_SECONDS: "1"
  TOOL_OUTBOX_RETRY_MAX_SECONDS: "60"
  TOOL_RECONCILIATION_DELAY_SECONDS: "2"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector:4318/v1/traces"
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://otel-collector:4318/v1/metrics"
  OTEL_METRIC_EXPORT_INTERVAL_MILLISECONDS: "15000"
