services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/supportgpt
      - REDIS_URL=redis://cache:6379/0
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-mock-support-v1}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_QA_MODEL_NAME=${LLM_QA_MODEL_NAME:-}
      - LLM_ANALYZER_MAX_TOKENS=${LLM_ANALYZER_MAX_TOKENS:-120}
      - LLM_RESOLVER_MAX_TOKENS=${LLM_RESOLVER_MAX_TOKENS:-320}
      - LLM_QA_MAX_TOKENS=${LLM_QA_MAX_TOKENS:-96}
      - LLM_RESOLVER_MAX_RAG_CHARS=${LLM_RESOLVER_MAX_RAG_CHARS:-5000}
      - LLM_RESOLVER_MAX_TOOL_CHARS=${LLM_RESOLVER_MAX_TOOL_CHARS:-2500}
      - LLM_QA_MAX_CONTEXT_CHARS=${LLM_QA_MAX_CONTEXT_CHARS:-4000}
      - APP_ENV=production
      - VECTOR_DB_PERSIST_DIR=/app/chromadb_store/0.5
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=supportgpt-backend
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://otel-collector:4318/v1/traces
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://otel-collector:4318/v1/metrics
      - OTEL_METRIC_EXPORT_INTERVAL_MILLISECONDS=15000
      - OTEL_EXPORTER_PREFLIGHT_ENABLED=false
      - LANGSMITH_CAPTURE_LLM_CONTENT=${LANGSMITH_CAPTURE_LLM_CONTENT:-true}
      - LANGSMITH_LLM_CONTENT_MAX_CHARS=${LANGSMITH_LLM_CONTENT_MAX_CHARS:-50000}
    volumes:
      - chromadb-data:/app/chromadb_store
    depends_on:
      - db
      - cache
      - otel-collector

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=supportgpt
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.45.0
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    environment:
      - OTEL_COLLECTOR_LANGSMITH_API_KEY=${OTEL_COLLECTOR_LANGSMITH_API_KEY:-}
      - OTEL_COLLECTOR_LANGSMITH_PROJECT=${OTEL_COLLECTOR_LANGSMITH_PROJECT:-supportgpt-enterprise}
      - OTEL_COLLECTOR_LANGSMITH_ENDPOINT=${OTEL_COLLECTOR_LANGSMITH_ENDPOINT:-https://api.smith.langchain.com/otel}
    volumes:
      - ../monitoring/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/supportgpt.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pg-data:
  chromadb-data:
  grafana-data:
